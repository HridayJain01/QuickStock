<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuickStock</title>
  <meta name="theme-color" content="#0a0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=7">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header id="top">
    <div class="hLeft">
      <div class="brand">⚡<b>Quick</b>Stock</div>
      <div class="clock"><b id="day">Day 1</b> <span id="time">09:15</span><div class="dayBar"><i id="dayProg"></i></div></div>
      <div id="mood" class="chip"></div>
    </div>
    <div class="hMid">
      <div class="nwBox"><small>NET WORTH</small><b id="nw"></b><span id="nwChg"></span></div>
      <div class="cashBox"><small>CASH</small><b id="cash"></b></div>
      <div id="title" class="chip"></div>
    </div>
    <div class="hRight">
      <div class="speed">
        <button data-act="speed:0" title="Pause (Space)">⏸</button><button data-act="speed:1">1x</button><button data-act="speed:2">2x</button><button data-act="speed:4">4x</button>
      </div>
      <button id="tipBtn" data-act="tip" title="Buy a shady tip">🕵️ Bhai ka tip</button>
      <button id="ipoBtn" data-act="ipo" class="ipo" hidden>🔔 IPO</button>
      <button id="themeBtn" class="iconBtn" data-act="theme" title="Light / dark theme">🌙</button>
      <button id="sndBtn" class="iconBtn" data-act="snd" title="Sound">🔊</button>
      <button id="cloudBtn" class="iconBtn" data-act="cloud" title="Sign in to save progress to the cloud">👤</button>
      <button class="iconBtn" data-act="help" title="How to play">❓</button>
      <button class="iconBtn" data-act="reset" title="New run">🔄</button>
    </div>
  </header>
  <div id="ticker"><div id="tickerTrack"></div></div>
  <div id="headline">📰 Market opening...</div>

  <main>
    <section id="pMarket" class="panel">
      <div class="listTools">
        <input id="search" type="search" placeholder="🔍 Search company, ticker, country">
        <div class="selRow">
          <select id="fSec"></select>
          <select id="fReg"></select>
        </div>
        <div class="selRow">
          <select id="sort">
            <option value="move">🔥 Top movers</option><option value="gain">📈 Top gainers</option><option value="lose">📉 Top losers</option>
            <option value="vol">💥 Most active</option><option value="az">🔤 A–Z</option><option value="price">💰 Price</option>
          </select>
          <button id="fWatch" title="Watchlist only">⭐ Watchlist</button>
          <span id="listCount" class="muted"></span>
        </div>
      </div>
      <div id="list"></div>
    </section>

    <section id="pChart" class="panel">
      <div id="coHead"></div>
      <div id="chart"></div>
      <div id="trade"></div>
      <div id="coInfo"></div>
    </section>

    <section id="pSide" class="panel">
      <nav class="tabs">
        <button data-act="tab:live">💼 Portfolio + 📰 News</button><button data-act="tab:biz">🏪 Business</button>
        <button data-act="tab:rivals">🏆 Rivals</button><button data-act="tab:ach">🎖️ Trophies</button>
      </nav>
      <div id="tabBody"></div>
    </section>
  </main>

  <nav id="mobNav">
    <button data-act="mob:pMarket">📊 Stocks</button><button data-act="mob:pChart">📈 Trade</button><button data-act="mob:pSide">📰 More</button>
  </nav>

  <div id="modal" hidden><div class="box" id="modalBox"></div></div>
  <div id="breaking" hidden></div>
  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="data.js?v=7"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
